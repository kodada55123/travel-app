<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI 營養師 - 蛋白質紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="style.css">
<meta name="description" content="拍照記錄飲食與InBody，AI協助估算蛋白質攝取">
<meta name="theme-color" content="#0F172A">
</head>
<body>
<div class="dynamic-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="noise-overlay"></div>
</div>

<header class="app-header">
  <div class="header-main">
    <h1 class="title">AI 營養師 <i class="ph-fill ph-leaf text-accent"></i></h1>
    <p class="subtitle" id="todayLabel">每日蛋白質追蹤</p>
  </div>
  <div class="tabs-wrapper">
    <div class="tabs-scroll" id="tabs">
      <button class="tab-btn active" data-target="page-today">
        <span class="tab-loc"><i class="ph-fill ph-fork-knife"></i> 今日紀錄</span>
      </button>
      <button class="tab-btn" data-target="page-inbody">
        <span class="tab-loc"><i class="ph-fill ph-scales"></i> InBody</span>
      </button>
      <button class="tab-btn" data-target="page-history">
        <span class="tab-loc"><i class="ph-fill ph-clock-counter-clockwise"></i> 歷史</span>
      </button>
      <button class="tab-btn" data-target="page-settings">
        <span class="tab-loc"><i class="ph-fill ph-gear"></i> 設定</span>
      </button>
    </div>
  </div>
</header>

<main class="app-main">

  <!-- 今日紀錄 -->
  <section class="day-content active" id="page-today">
    <div class="card protein-card">
      <div class="protein-ring-wrap">
        <svg class="protein-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fg" id="proteinRing" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="protein-ring-text">
          <span id="proteinConsumed">0</span>
          <small>/ <span id="proteinGoal">120</span> g</small>
        </div>
      </div>
      <div class="protein-stats">
        <div class="stat-item"><span class="stat-label">已攝取</span><span class="stat-value" id="proteinConsumed2">0 g</span></div>
        <div class="stat-item"><span class="stat-label">剩餘</span><span class="stat-value" id="proteinRemain">120 g</span></div>
        <div class="stat-item"><span class="stat-label">熱量</span><span class="stat-value" id="caloriesTotal">0 kcal</span></div>
      </div>
    </div>

    <div class="card">
      <h3 class="section-title"><i class="ph-fill ph-camera"></i> 新增飲食紀錄</h3>
      <div class="add-mode-toggle">
        <button class="mode-btn active" data-mode="food">📷 拍食物照（AI搜尋營養）</button>
        <button class="mode-btn" data-mode="label">🏷️ 拍營養標示（AI辨識數值）</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
      <button class="btn-primary" id="pickPhotoBtn"><i class="ph-fill ph-image"></i> 選擇/拍攝照片</button>
      <div id="photoPreviewWrap" class="photo-preview-wrap" style="display:none">
        <img id="photoPreview" class="photo-preview">
        <button class="btn-secondary" id="analyzeBtn"><i class="ph-fill ph-magic-wand"></i> AI 分析</button>
      </div>
      <div id="analyzeStatus" class="analyze-status"></div>

      <form id="foodForm" class="food-form" style="display:none">
        <div class="form-row">
          <label>名稱</label>
          <input type="text" id="f_name" required>
        </div>
        <div class="form-row form-row-grid">
          <div><label>蛋白質 (g)</label><input type="number" step="0.1" id="f_protein" required></div>
          <div><label>熱量 (kcal)</label><input type="number" step="1" id="f_calories"></div>
        </div>
        <div class="form-row form-row-grid">
          <div><label>碳水 (g)</label><input type="number" step="0.1" id="f_carbs"></div>
          <div><label>脂肪 (g)</label><input type="number" step="0.1" id="f_fat"></div>
        </div>
        <div class="form-row">
          <label>份量備註</label>
          <input type="text" id="f_note" placeholder="例如：一份 / 100g / 一杯">
        </div>
        <button type="submit" class="btn-primary"><i class="ph-fill ph-plus"></i> 加入今日紀錄</button>
      </form>
    </div>

    <div class="card">
      <h3 class="section-title"><i class="ph-fill ph-list-checks"></i> 今日已記錄</h3>
      <div id="todayList" class="food-list"></div>
    </div>
  </section>

  <!-- InBody -->
  <section class="day-content" id="page-inbody">
    <div class="card">
      <h3 class="section-title"><i class="ph-fill ph-scales"></i> 新增 InBody 紀錄</h3>
      <form id="inbodyForm" class="food-form">
        <div class="form-row"><label>日期</label><input type="date" id="ib_date" required></div>
        <div class="form-row form-row-grid">
          <div><label>體重 (kg)</label><input type="number" step="0.1" id="ib_weight"></div>
          <div><label>骨骼肌量 (kg)</label><input type="number" step="0.1" id="ib_muscle"></div>
        </div>
        <div class="form-row form-row-grid">
          <div><label>體脂率 (%)</label><input type="number" step="0.1" id="ib_fat"></div>
          <div><label>體脂量 (kg)</label><input type="number" step="0.1" id="ib_fatmass"></div>
        </div>
        <div class="form-row"><label>InBody建議每日蛋白質 (g，選填)</label><input type="number" step="1" id="ib_protein"></div>
        <button type="submit" class="btn-primary"><i class="ph-fill ph-plus"></i> 儲存紀錄</button>
      </form>
    </div>
    <div class="card">
      <h3 class="section-title"><i class="ph-fill ph-trend-up"></i> InBody 歷史</h3>
      <div id="inbodyList" class="food-list"></div>
    </div>
  </section>

  <!-- 歷史 -->
  <section class="day-content" id="page-history">
    <div class="card">
      <h3 class="section-title"><i class="ph-fill ph-calendar"></i> 過去飲食紀錄</h3>
      <div id="historyList" class="food-list"></div>
    </div>
  </section>

  <!-- 設定 -->
  <section class="day-content" id="page-settings">
    <div class="card">
      <h3 class="section-title"><i class="ph-fill ph-gear"></i> 目標設定</h3>
      <div class="form-row"><label>每日蛋白質目標 (g)</label><input type="number" id="s_proteinGoal" step="1"></div>
      <button class="btn-primary" id="saveGoalBtn"><i class="ph-fill ph-check"></i> 儲存目標</button>
    </div>
    <div class="card">
      <h3 class="section-title"><i class="ph-fill ph-key"></i> AI 分析設定</h3>
      <p class="hint-text">本網站為純前端架構，AI 圖片辨識需要你自己的 Anthropic API 金鑰。金鑰只會儲存在「你目前這台裝置的瀏覽器」中（localStorage），不會上傳到任何伺服器。請至 <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> 取得金鑰。</p>
      <div class="form-row"><label>Anthropic API Key</label><input type="password" id="s_apiKey" placeholder="sk-ant-..."></div>
      <button class="btn-primary" id="saveKeyBtn"><i class="ph-fill ph-check"></i> 儲存金鑰</button>
      <p class="hint-text small" id="keyStatus"></p>
    </div>
    <div class="card">
      <h3 class="section-title"><i class="ph-fill ph-trash"></i> 資料管理</h3>
      <p class="hint-text">所有資料僅存於本機瀏覽器，清除瀏覽器資料會遺失紀錄。</p>
      <button class="btn-secondary danger" id="clearAllBtn"><i class="ph-fill ph-warning"></i> 清除所有資料</button>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
